name: Release

# 推送 v* 标签时自动构建 macOS dmg 并创建 GitHub Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 构建(Tauri)
        run: npm run tauri build

      - name: 重命名 dmg(ASCII 安全)
        run: |
          mkdir -p dist
          for f in src-tauri/target/release/bundle/dmg/*.dmg; do
            base=$(basename "$f")
            newname=$(echo "$base" | sed 's/数镜/shujing/')
            cp "$f" "dist/$newname"
          done
          ls -lah dist

      - name: 发布 Release 并上传 dmg
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          body_path: .github/release_body.md

      - name: 清理旧命名资产
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep '^_' | while read -r a; do
            gh release delete-asset "$GITHUB_REF_NAME" "$a" --yes
          done
